<!DOCTYPE html><!-- Mobile App Mode Settings -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0d16">

<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming-Mall - Admin Panel</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #cce600;
      --bg-dark: #0a0d16;
      --card-bg: #131826;
      --card-border: #1e263d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 15px; }

    /* PIN LOCK SCREEN */
    .login-box {
      max-width: 350px; margin: 80px auto 0; background: var(--card-bg);
      border: 1px solid var(--card-border); border-radius: 14px; padding: 24px; text-align: center;
    }
    .brand-logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; margin-bottom: 6px; }
    .brand-logo span { color: var(--primary); }
    .pin-input {
      width: 100%; background: #090c14; border: 1px solid var(--card-border); color: #fff;
      padding: 12px; border-radius: 8px; font-size: 1.4rem; letter-spacing: 6px; text-align: center;
      margin: 18px 0; outline: none;
    }

    /* DASHBOARD */
    #dashboardView { display: none; max-width: 800px; margin: 0 auto; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); margin-bottom: 15px; }
    .header-title { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px; text-align: center; }
    .stat-val { font-size: 1.25rem; font-weight: 700; font-family: 'Rajdhani', sans-serif; color: var(--primary); }
    .stat-label { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }

    .search-box { width: 100%; background: #090c14; border: 1px solid var(--card-border); color: #fff; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; outline: none; font-size: 0.85rem; }

    /* ORDER CARD */
    .order-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .order-card.pending_payment { border-left: 4px solid var(--warning); }
    .order-card.approved { border-left: 4px solid var(--success); }
    .order-card.shipped { border-left: 4px solid var(--info); }
    .order-card.cancelled { border-left: 4px solid var(--danger); opacity: 0.7; }

    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .order-id { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.1rem; color: #fff; }
    
    .status-badge { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
    .status-pending_payment { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .status-approved { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
    .status-shipped { background: rgba(56, 189, 248, 0.2); color: var(--info); border: 1px solid var(--info); }
    .status-cancelled { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    .detail-row { font-size: 0.82rem; color: #cbd5e1; margin-bottom: 5px; line-height: 1.4; }
    .utr-tag { background: #090c14; border: 1px solid var(--card-border); padding: 2px 7px; border-radius: 4px; color: var(--info); font-family: monospace; font-size: 0.85rem; }

    .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 12px; border-top: 1px solid var(--card-border); padding-top: 10px; }
    .btn { padding: 9px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 0.72rem; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-approve { background: var(--success); color: #000; }
    .btn-track { background: var(--info); color: #000; }
    .btn-wa { background: #25d366; color: #000; }
    .btn-reject { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
  </style>
</head>
<body>

  <!-- 1. PIN LOCK -->
  <div class="login-box" id="loginBox">
    <div class="brand-logo">Gaming-<span>Mall</span></div>
    <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 12px;">Admin Operator Access</p>
    <input type="password" id="adminPin" class="pin-input" placeholder="••••" maxlength="4" autofocus />
    <button class="btn btn-approve" style="width: 100%; padding: 12px;" onclick="verifyPin()">Unlock Dashboard</button>
  </div>

  <!-- 2. MAIN DASHBOARD -->
  <div id="dashboardView">
    <div class="header-bar">
      <div class="header-title"><i class="fa-solid fa-shield-halved"></i> Orders Management</div>
      <button class="btn" style="background:transparent; border:1px solid var(--card-border); color:var(--text-muted);" onclick="location.reload()">Lock</button>
    </div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-val" id="statRevenue">₹0</div>
        <div class="stat-label">Total Verified</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statPending" style="color:var(--warning);">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statTotal" style="color:var(--info);">0</div>
        <div class="stat-label">Total Orders</div>
      </div>
    </div>

    <!-- SEARCH BAR -->
    <input type="text" id="adminSearchInput" class="search-box" placeholder="🔍 Search Order ID, Customer, Phone, or UTR..." onkeyup="filterOrders()" />

    <!-- LIVE ORDERS LIST -->
    <div id="ordersContainer">
      <p style="text-align: center; color: var(--text-muted); padding: 30px;">Loading Supabase Orders...</p>
    </div>
  </div>

  <script>
    // SUPABASE CREDENTIALS LINKED
    const SUPABASE_URL = "https://aewwlmhkjraolaajhppq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFld3dsbWhranJhb2xhYWpocHBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1ODc4NjAsImV4cCI6MjEwNjE2Mzg2MH0.YAu3OJXpCwjza9_IdkjogsDZqi4Y0bMuIjYAD5uH1DM";
    
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ADMIN_PIN = "1234";
    let ordersList = [];

    function verifyPin() {
      if (document.getElementById('adminPin').value.trim() === ADMIN_PIN) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'block';
        fetchOrders();
      } else {
        alert("Galat Security PIN!");
      }
    }

    document.getElementById('adminPin').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verifyPin();
    });

    // FETCH ORDERS FROM SUPABASE
    async function fetchOrders() {
      try {
        const { data, error } = await dbClient
          .from('orders')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        ordersList = data || [];
        renderOrders(ordersList);
      } catch (err) {
        console.error("Fetch orders error:", err);
        document.getElementById('ordersContainer').innerHTML = `
          <p style="color:var(--danger); text-align:center; padding:20px;">
            Error loading orders: ${err.message}
          </p>`;
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById('ordersContainer');
      let rev = 0, pen = 0;

      if (orders.length === 0) {
        container.innerHTML = "<p style='text-align:center; color:var(--text-muted); padding:30px;'>Abhi tak koi order nahi mila.</p>";
        document.getElementById('statRevenue').innerText = "₹0";
        document.getElementById('statPending').innerText = "0";
        document.getElementById('statTotal').innerText = "0";
        return;
      }

      container.innerHTML = orders.map(o => {
        const amountRs = Math.round(o.total_amount_paise / 100);
        const status = o.status || 'pending_payment';

        if (status === 'approved' || status === 'shipped') {
          rev += amountRs;
        }
        if (status === 'pending_payment') {
          pen++;
        }

        return `
          <div class="order-card ${status}">
            <div class="card-top">
              <span class="order-id">${o.order_number}</span>
              <span class="status-badge status-${status}">${status.replace('_', ' ')}</span>
            </div>
            
            <div style="color:var(--primary); font-weight:700; font-size:1.1rem; margin-bottom:6px;">
              ₹${amountRs}
            </div>

            <div class="detail-row"><strong>Customer:</strong> ${o.customer_name} (<a href="tel:${o.customer_phone}" style="color:var(--primary); text-decoration:none;">${o.customer_phone}</a>)</div>
            <div class="detail-row"><strong>Address:</strong> ${o.delivery_address}</div>
            <div class="detail-row"><strong>UTR Ref No:</strong> <span class="utr-tag">${o.utr_number || 'N/A'}</span></div>
            ${o.tracking_note ? `<div class="detail-row" style="color:var(--info); font-weight:600;"><i class="fa-solid fa-truck"></i> ${o.tracking_note}</div>` : ''}

            <div class="action-grid">
              ${status === 'pending_payment' ? `
                <button class="btn btn-approve" onclick="updateOrderStatus('${o.id}', 'approved')"><i class="fa-solid fa-check"></i> Approve</button>
              ` : ''}

              <button class="btn btn-track" onclick="updateTrackingNote('${o.id}')"><i class="fa-solid fa-truck"></i> Track Note</button>
              
              <button class="btn btn-wa" onclick="openCustomerWhatsApp('${o.customer_phone}', '${o.order_number}', '${status}')"><i class="fa-brands fa-whatsapp"></i> Chat</button>
              
              <button class="btn btn-reject" onclick="deleteOrCancelOrder('${o.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('statRevenue').innerText = `₹${rev}`;
      document.getElementById('statPending').innerText = pen;
      document.getElementById('statTotal').innerText = orders.length;
    }

    // APPROVE ORDER
    async function updateOrderStatus(orderId, newStatus) {
      try {
        const { error } = await dbClient
          .from('orders')
          .update({ status: newStatus, tracking_note: "Payment Verified - Preparing for dispatch" })
          .eq('id', orderId);

        if (error) throw error;
        alert("Payment Verified! Order Approved ho gaya.");
        fetchOrders();
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    // UPDATE TRACKING AWB / NOTES
    async function updateTrackingNote(orderId) {
      const note = prompt("Enter Tracking AWB No. ya Delivery Note (e.g. 'BlueDart AWB 948271' ya 'Dispatched via DTDC'):");
      if (!note) return;

      try {
        const { error } = await dbClient
          .from('orders')
          .update({ status: 'shipped', tracking_note: note })
          .eq('id', orderId);

        if (error) throw error;
        alert("Tracking note update ho gaya!");
        fetchOrders();
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    // CHAT DIRECTLY WITH CUSTOMER ON WHATSAPP
    function openCustomerWhatsApp(phone, orderId, status) {
      const cleanPhone = phone.replace(/[^0-9]/g, '').slice(-10);
      const text = `Hello! Gaming-Mall se aapka order *${orderId}* status: *${status}* hai.`;
      window.open(`https://wa.me/91${cleanPhone}?text=${encodeURIComponent(text)}`, '_blank');
    }

    // DELETE / CANCEL FAKE ORDER
    async function deleteOrCancelOrder(orderId) {
      if (!confirm("Kya aap sach me yeh fake ya cancelled order delete karna chahte hain?")) return;

      try {
        const { error } = await dbClient
          .from('orders')
          .delete()
          .eq('id', orderId);

        if (error) throw error;
        alert("Order delete kar diya gaya.");
        fetchOrders();
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    // SEARCH BAR FILTER
    function filterOrders() {
      const q = document.getElementById('adminSearchInput').value.toLowerCase();
      const filtered = ordersList.filter(o => 
        (o.order_number && o.order_number.toLowerCase().includes(q)) ||
        (o.customer_name && o.customer_name.toLowerCase().includes(q)) ||
        (o.customer_phone && o.customer_phone.includes(q)) ||
        (o.utr_number && o.utr_number.toLowerCase().includes(q))
      );
      renderOrders(filtered);
    }
  </script>
</body>
</html>
